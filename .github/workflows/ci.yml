name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B verify

  # Same jar against a real Postgres: migrations apply and a reservation goes through
  postgres-smoke-test:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: inventory
          POSTGRES_DB: inventory
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U inventory" --health-interval 2s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B -q -DskipTests package
      - name: Start the service
        run: |
          java -jar target/inventory-reservation-service-*.jar \
            --spring.datasource.url=jdbc:postgresql://localhost:5432/inventory \
            --spring.datasource.username=inventory --spring.datasource.password=inventory &
          for i in $(seq 1 60); do curl -sf localhost:8080/api/stock/HB-COLA-330 && break; sleep 1; done
      - name: Reserve and confirm
        run: |
          id=$(curl -sf -X POST localhost:8080/api/reservations -H 'Content-Type: application/json' \
               -H 'Idempotency-Key: ci-1' -d '{"orderRef":"CI-1","lines":[{"sku":"HB-COLA-330","quantity":10}]}' | jq -r .id)
          curl -sf -X POST localhost:8080/api/reservations/$id/confirm | jq -e '.status == "CONFIRMED"'
