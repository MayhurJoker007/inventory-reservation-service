spring.application.name=inventory-reservation-service

# H2 in PostgreSQL mode for local runs; point these at Postgres for real use (the migrations run on both)
spring.datasource.url=jdbc:h2:mem:inventory;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

inventory.default-hold-minutes=15
inventory.expiry-check-ms=30000
